<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IG Downloader - Settings</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div class="app-container">
    <!-- Navigation Bar -->
    <nav class="bottom-nav">
      <a href="/" class="nav-item">
        <i class="bi bi-house-door-fill"></i>
        <span>Home</span>
      </a>
      <a href="/download" class="nav-item">
        <i class="bi bi-download"></i>
        <span>Download</span>
      </a>
      <a href="/history" class="nav-item">
        <i class="bi bi-clock-history"></i>
        <span>History</span>
      </a>
      <a href="/settings" class="nav-item active">
        <i class="bi bi-gear-fill"></i>
        <span>Settings</span>
      </a>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h2 class="page-title">Settings</h2>
      </div>

      <div class="settings-container">
        <!-- Dark Mode Toggle -->
        <div class="setting-item">
          <div class="setting-info">
            <i class="bi bi-moon-stars"></i>
            <div>
              <h3>Dark Mode</h3>
              <p>Switch between themes</p>
            </div>
          </div>
          <label class="switch">
            <input type="checkbox" id="darkModeToggle" checked>
            <span class="slider round"></span>
          </label>
        </div>

        <!-- Auto Download -->
        <div class="setting-item">
          <div class="setting-info">
            <i class="bi bi-arrow-repeat"></i>
            <div>
              <h3>Auto Download</h3>
              <p>Start download automatically</p>
            </div>
          </div>
          <label class="switch">
            <input type="checkbox" id="autoDownloadToggle">
            <span class="slider round"></span>
          </label>
        </div>

        <!-- Download Quality -->
        <div class="setting-item">
          <div class="setting-info">
            <i class="bi bi-hdd-stack"></i>
            <div>
              <h3>Download Quality</h3>
              <p>SD &nbsp; HD &nbsp; FHD</p>
            </div>
          </div>
          <div class="quality-selector">
            <button class="quality-btn active" data-quality="SD">SD</button>
            <button class="quality-btn" data-quality="HD">HD</button>
            <button class="quality-btn" data-quality="FHD">FHD</button>
          </div>
        </div>

        <!-- About Section -->
        <div class="about-section">
          <h3>About</h3>
          <p class="about-text">
            <i class="bi bi-instagram"></i>
            Download Instagram reels, posts & videos in HD. 
            100% Free - HD Quality - No Watermark
          </p>
        </div>

        <!-- Clear History Button -->
        <button class="btn btn-secondary btn-full" onclick="clearAllHistory()">
          <i class="bi bi-trash"></i> Clear Download History
        </button>
      </div>
    </main>
  </div>

  <script>
    // Load settings
    function loadSettings() {
      // Dark Mode
      const darkMode = localStorage.getItem('darkMode') !== 'false';
      document.getElementById('darkModeToggle').checked = darkMode;
      if (!darkMode) {
        document.body.classList.add('light-mode');
      }

      // Auto Download
      const autoDownload = localStorage.getItem('autoDownload') === 'true';
      document.getElementById('autoDownloadToggle').checked = autoDownload;

      // Quality
      const quality = localStorage.getItem('downloadQuality') || 'HD';
      document.querySelectorAll('.quality-btn').forEach(btn => {
        if (btn.dataset.quality === quality) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    // Dark Mode Toggle
    document.getElementById('darkModeToggle').addEventListener('change', (e) => {
      if (e.target.checked) {
        document.body.classList.remove('light-mode');
        localStorage.setItem('darkMode', 'true');
      } else {
        document.body.classList.add('light-mode');
        localStorage.setItem('darkMode', 'false');
      }
    });

    // Auto Download Toggle
    document.getElementById('autoDownloadToggle').addEventListener('change', (e) => {
      localStorage.setItem('autoDownload', e.target.checked);
    });

    // Quality Selection
    document.querySelectorAll('.quality-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        localStorage.setItem('downloadQuality', btn.dataset.quality);
      });
    });

    // Clear History
    function clearAllHistory() {
      if (confirm('Are you sure you want to clear all download history?')) {
        localStorage.removeItem('downloadHistory');
        alert('History cleared successfully!');
      }
    }

    // Load settings on page load
    loadSettings();

    // Set active nav
    const currentPath = window.location.pathname;
    document.querySelectorAll('.nav-item').forEach(item => {
      if (item.getAttribute('href') === currentPath) {
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });
  </script>
</body>
</html>
