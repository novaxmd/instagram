<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Instagram Downloader</title>
  
  <!-- Meta Tags -->
  <meta name="description" content="Download Instagram reels, photos & videos in HD. Fast, secure & free.">
  <meta name="theme-color" content="#98ff98">
  
  <!-- PWA / Manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Icons -->
  <link rel="icon" type="image/png" href="/pages/logo.png">
  <link rel="apple-touch-icon" href="/pages/logo.png">
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Bar - Install Button -->
    <div class="top-bar">
      <div class="logo-container">
        <img src="/pages/logo.png" alt="Logo" class="nav-logo">
        <span class="logo-text">IG Downloader</span>
      </div>
      <button class="install-btn" id="installBtn" style="display: none;">
        <i class="bi bi-download"></i> Install App
      </button>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="#" class="nav-item active" data-page="home">
        <i class="bi bi-house-door-fill"></i>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item" data-page="download">
        <i class="bi bi-download"></i>
        <span>Download</span>
      </a>
      <a href="#" class="nav-item" data-page="history">
        <i class="bi bi-clock-history"></i>
        <span>History</span>
      </a>
      <a href="#" class="nav-item" data-page="settings">
        <i class="bi bi-gear-fill"></i>
        <span>Settings</span>
      </a>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
      <!-- Content loaded dynamically -->
    </main>

    <!-- Loading Overlay -->
    <div id="loadingState" class="loading-state hidden">
      <div class="spinner"></div>
      <p>Processing...</p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="pages/script.js"></script>
  
  <script>
    // ==================== PWA INSTALL BUTTON ====================
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      
      if (outcome === 'accepted') {
        console.log('App installed');
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      console.log('App installed successfully');
    });

    // ==================== REGISTER SERVICE WORKER ====================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registered'))
          .catch(err => console.log('Service Worker failed:', err));
      });
    }

    // Handle back button
    window.addEventListener('popstate', () => {
      loadPage('home');
      document.querySelectorAll('.nav-item').forEach(item => {
        if (item.dataset.page === 'home') {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    });

    history.pushState({ page: 'home' }, '', '/');
  </script>
</body>
</html>
